name: Bootstrap/rotate cluster secrets

# Manual only. ArgoCD (see argocd/) deploys everything else in Kubernates/ automatically,
# but it's deliberately told to ignore secrets.yaml (which only ever has placeholder text
# in git) - so the real farmconnect-secrets Kubernetes Secret has to be created some other
# way. This is that other way. Run it once before your first ArgoCD sync, and again
# whenever you rotate JWT_SECRET or MYSQL_ROOT_PASSWORD.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS role assumption (no stored AWS keys)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  bootstrap-secrets:
    name: Create/update farmconnect-secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Ensure namespace exists
        run: kubectl create namespace farmconnect --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update farmconnect-secrets
        run: |
          kubectl create secret generic farmconnect-secrets \
            --namespace farmconnect \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Restart services that read this secret
        # selfHeal in ArgoCD's syncPolicy won't restart pods on its own just because a
        # Secret's contents changed underneath them - do it explicitly so JWT_SECRET
        # rotation actually takes effect instead of pods silently keeping the old value
        # they read at startup.
        #
        # NOTE ON MYSQL_ROOT_PASSWORD SPECIFICALLY: restarting user-db/product-db/order-db
        # here would NOT rotate anything real - MySQL only reads MYSQL_ROOT_PASSWORD on
        # first initialization of an empty data directory; on a restart with existing data
        # it's ignored entirely. Rotating the actual database password (not just what this
        # Secret says it is) means running, inside each DB pod, BEFORE updating the Secret
        # above:
        #   kubectl exec -n farmconnect user-db-0 -- \
        #     mysql -uroot -p'<current-password>' -e "ALTER USER 'root'@'%' IDENTIFIED BY '<new-password>';"
        # repeated for product-db-0 and order-db-0. Do that first, then re-run this whole
        # workflow with the new MYSQL_ROOT_PASSWORD secret so the app services pick it up.
        run: |
          kubectl rollout restart deployment -n farmconnect \
            user-service product-service order-service admin-service api-gateway
