apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: farmconnect
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: "https://github.com/thiwanka-mpj/FarmConnect-Project.git"
    targetRevision: main
    path: Kubernetes
    directory:
      recurse: true
      exclude: '{complete-deploy.yml,secrets.yaml}'

  destination:
    server: https://kubernetes.default.svc 
    namespace: farmconnect

  syncPolicy:
    automated:
      prune: true 
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true 
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
