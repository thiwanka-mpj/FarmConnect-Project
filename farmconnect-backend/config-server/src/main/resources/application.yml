server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Config files are bundled into the jar under config-repo/ - no external git repo
          # or volume needed to run this locally. Swap to a git backend for a real multi-team setup.
          search-locations: classpath:/config-repo

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,refresh
