# Shared defaults inherited by every service (application.yml is the "global" file in
# Spring Cloud Config's native/git backend - every {service-name}.yml below adds to or
# overrides this). Secrets are deliberately NOT here - they stay in each service's own
# environment variables (see docker-compose.yml / .env.example) so this repo can be
# committed to git safely.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  topics:
    order-events: order-events

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
