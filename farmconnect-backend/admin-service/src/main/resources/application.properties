# Application Name
spring.application.name=admin-service

# Server Port
server.port=8084

# admin-service owns no database - every number on the dashboard is fetched live from
# user-service, product-service, and order-service (see AdminService + *ServiceClient).

# JWT Configuration - used only to validate tokens and to forward the caller's token to
# downstream services (see AuthHeaderForwardingInterceptor).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-anywhere-real}

# CORS - comma separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost}

# Logging
logging.level.com.farmconnect.adminservice=${LOG_LEVEL:INFO}

# Error Messages
server.error.include-message=${ERROR_INCLUDE_MESSAGE:on_param}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING:on_param}
server.error.include-stacktrace=never

# Actuator - expose only the health endpoint, and only minimal detail
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Service mesh (Eureka + Config Server) ---
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-service:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# --- Resilience4j: circuit breaker + retry around each downstream service call ---
# Base "default" sliding-window/threshold values come from config-server (shared across services).
resilience4j.circuitbreaker.instances.userService.base-config=default
resilience4j.circuitbreaker.instances.productService.base-config=default
resilience4j.circuitbreaker.instances.orderService.base-config=default
resilience4j.retry.instances.userService.base-config=default
resilience4j.retry.instances.productService.base-config=default
resilience4j.retry.instances.orderService.base-config=default
