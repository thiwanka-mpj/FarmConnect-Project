# Application Name
spring.application.name=user-service

# Server Port
server.port=8081

# Database Configuration - all values come from the environment, never hardcoded.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# ddl-auto=validate in every non-local profile: the schema is owned by database/user-db/init.sql,
# Hibernate should never silently alter it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - secret MUST be supplied via env var in every environment but local dev.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-anywhere-real}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - comma separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.farmconnect.userservice=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# Error Messages - don't leak stack traces/internal messages in production
server.error.include-message=${ERROR_INCLUDE_MESSAGE:on_param}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING:on_param}
server.error.include-stacktrace=never

# Actuator - expose only the health endpoint, and only minimal detail
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Service mesh (Eureka + Config Server) ---
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-service:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}
