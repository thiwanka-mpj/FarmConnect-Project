# Application Name
spring.application.name=order-service

# Server Port
server.port=8083

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - used only to validate tokens issued by user-service.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-anywhere-real}

# CORS - comma separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.com.farmconnect.orderservice=${LOG_LEVEL:INFO}

# Error Messages
server.error.include-message=${ERROR_INCLUDE_MESSAGE:on_param}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING:on_param}
server.error.include-stacktrace=never

# Actuator - expose only the health endpoint, and only minimal detail
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Service mesh (Eureka + Config Server) ---
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://discovery-service:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# --- Resilience4j: circuit breaker + retry around the product-service call ---
# Base "default" sliding-window/threshold values come from config-server (shared across services).
resilience4j.circuitbreaker.instances.productService.base-config=default
resilience4j.retry.instances.productService.base-config=default
resilience4j.retry.instances.productService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# --- Kafka producer ---
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
kafka.topics.order-events=order-events
