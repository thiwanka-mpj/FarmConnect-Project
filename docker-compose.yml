services:
  # ---------------- Infrastructure ----------------
  # Database-per-service: each business service owns its own MySQL instance/schema.
  # No service ever connects to another service's database directly.

  user-db:
    build:
      context: ./database/user-db
      dockerfile: Dockerfile
    image: farmconnect-user-db:${TAG:-local}
    container_name: farmconnect-user-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  product-db:
    build:
      context: ./database/product-db
      dockerfile: Dockerfile
    image: farmconnect-product-db:${TAG:-local}
    container_name: farmconnect-product-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: product_db
    ports:
      - "3308:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  order-db:
    build:
      context: ./database/order-db
      dockerfile: Dockerfile
    image: farmconnect-order-db:${TAG:-local}
    container_name: farmconnect-order-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: order_db
    ports:
      - "3309:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: farmconnect-redis
    restart: unless-stopped
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-broker Kafka in KRaft mode - no Zookeeper needed for local dev.
  # Uses the official Apache Kafka image (bitnami's short version tags like 3.7 have
  # been pulled from the free Docker Hub catalog, so we don't depend on those).
  kafka:
    image: apache/kafka:3.7.0
    container_name: farmconnect-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------- Service mesh ----------------

  discovery-service:
    build:
      context: ./farmconnect-backend
      dockerfile: discovery-service/Dockerfile
    image: farmconnect-discovery-service:${TAG:-local}
    container_name: farmconnect-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  config-server:
    build:
      context: ./farmconnect-backend
      dockerfile: config-server/Dockerfile
    image: farmconnect-config-server:${TAG:-local}
    container_name: farmconnect-config-server
    restart: unless-stopped
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: ./farmconnect-backend
      dockerfile: api-gateway/Dockerfile
    image: farmconnect-api-gateway:${TAG:-local}
    container_name: farmconnect-api-gateway
    restart: unless-stopped
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------- Business services ----------------

  user-service:
    build:
      context: ./farmconnect-backend
      dockerfile: user-service/Dockerfile
    image: farmconnect-user-service:${TAG:-local}
    container_name: farmconnect-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://user-db:3306/user_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      EUREKA_URI: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  product-service:
    build:
      context: ./farmconnect-backend
      dockerfile: product-service/Dockerfile
    image: farmconnect-product-service:${TAG:-local}
    container_name: farmconnect-product-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://product-db:3306/product_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      EUREKA_URI: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - product-uploads:/app/uploads
    depends_on:
      product-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  order-service:
    build:
      context: ./farmconnect-backend
      dockerfile: order-service/Dockerfile
    image: farmconnect-order-service:${TAG:-local}
    container_name: farmconnect-order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      EUREKA_URI: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      order-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # admin-service owns no database of its own - see database-per-service split in README.
  # It aggregates live data from user-service/product-service/order-service over REST.
  admin-service:
    build:
      context: ./farmconnect-backend
      dockerfile: admin-service/Dockerfile
    image: farmconnect-admin-service:${TAG:-local}
    container_name: farmconnect-admin-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URI: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------- Frontend ----------------

  frontend:
    build:
      context: ./farmconnect-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
    image: farmconnect-frontend:${TAG:-local}
    container_name: farmconnect-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - farmconnect-network

networks:
  farmconnect-network:
    driver: bridge

volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  product-uploads:
  kafka-data:
