apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: farmconnect
  labels:
    app: discovery-service
spec:
  replicas: 1  # Eureka peers would need each other's address to cluster - single instance for now
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: discovery-service
          # Build & push from ./farmconnect-backend (Dockerfile: discovery-service/Dockerfile)
          # to your Docker Hub repo, then replace this placeholder.
          image: "<DOCKERHUB_USERNAME>/farmconnect-discovery-service:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
