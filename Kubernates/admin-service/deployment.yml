# admin-service owns no database of its own (see database-per-service split) - it only
# needs Eureka/config-server/JWT wiring, no SPRING_DATASOURCE_* env vars at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: farmconnect
  labels:
    app: admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: admin-service
          image: "thiwanka365/farmconnect-admin-service:9dc869cc553431b079897a467e05f6ceeffa0081"
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
              name: http
          envFrom:
            - configMapRef:
                name: farmconnect-config
            - secretRef:
                name: farmconnect-secrets
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 50
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
