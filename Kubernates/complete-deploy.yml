# ============================================================================
# FarmConnect - complete-deploy.yml
#
# Single-file version of every manifest in this directory, in dependency order,
# for a one-shot manual deploy:
#
#   kubectl apply -f complete-deploy.yml
#
# This is a FALLBACK path. The primary way to deploy this project is ArgoCD/GitOps -
# see ../argocd/README.md. ArgoCD is deliberately configured to IGNORE this specific
# file (see argocd/application.yaml's directory.exclude) so it never conflicts with
# the individual per-service files it actually syncs.
#
# Prerequisites before running this:
#   1. Push every image to Docker Hub and replace every "<DOCKERHUB_USERNAME>" placeholder
#      below with your real Docker Hub username (docker-publish.yml does this
#      automatically if you're using the CI pipeline - see Kubernates/README.md).
#   2. Create the real farmconnect-secrets Secret separately - do NOT apply the
#      secrets.yaml in this repo as-is, it only ever contains placeholder text. Either
#      run .github/workflows/bootstrap-secrets.yml, or see secrets.yaml's own comments
#      for the equivalent kubectl one-liner.
#   3. Make sure your EKS cluster has the EBS CSI driver add-on installed - the 3
#      databases and Kafka all provision persistent volumes and will stay Pending
#      without it.
#   4. Install the AWS Load Balancer Controller - the frontend Ingress needs it
#      to actually provision an ALB. See frontend/ingress.yml's comments for the install
#      command. Without it, the Ingress object will apply fine but never get an ADDRESS.
#
# kubectl doesn't guarantee startup ordering the way docker-compose's depends_on +
# healthcheck did - pods for e.g. user-service will crash-loop for a bit if user-db
# or config-server aren't ready yet. That's expected; Kubernetes restarts them with
# backoff until their dependencies come up, and the readiness probes keep traffic
# away from them in the meantime. Give it 3-5 minutes on a first deploy before
# concluding something is actually wrong (`kubectl get pods -n farmconnect -w`).
#
# Prefer applying the individual files in each service's folder instead? Same specs,
# just easier to diff/review one service at a time:
#   kubectl apply -f namespace.yaml -f serviceaccount.yml -f configmap.yaml
#   kubectl apply -f discovery-service/ -f config-server/ -f redis/ -f kafka/
#   kubectl apply -f user-db/ -f product-db/ -f order-db/
#   kubectl apply -f user-service/ -f product-service/ -f order-service/ -f admin-service/
#   kubectl apply -f api-gateway/ -f frontend/
# ============================================================================

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: farmconnect
  labels:
    app.kubernetes.io/part-of: farmconnect

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
---
# Every pod in this project runs as this service account instead of "default" - gives us
# a single place to attach IAM permissions later (IRSA) if a service ever needs to talk
# to an AWS API directly (e.g. product-service uploading to S3 instead of local disk),
# and a single place to attach image pull credentials if your Docker Hub repos are private.
#
# --- IRSA (only needed if a pod needs to call an AWS API directly) ---
#   1. Create an IAM role with a trust policy for your cluster's OIDC provider
#      (the EKS+VPC Terraform you already provisioned should have created the OIDC
#      provider - `terraform output` or `aws eks describe-cluster` will have its URL/ARN).
#   2. Uncomment the annotation below and set the role ARN.
#   3. `kubectl apply -f serviceaccount.yml` again to pick up the change, then roll the
#      relevant deployments (`kubectl rollout restart deployment/<name> -n farmconnect`)
#      so their pods pick up the new token projection.
#
# --- Private Docker Hub repos ---
# If you pushed the farmconnect-* images to PRIVATE Docker Hub repositories (public repos
# need none of this - it's only for private ones), every pod needs pull credentials:
#   kubectl create secret docker-registry dockerhub-creds \
#     --namespace farmconnect \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=<your-dockerhub-username> \
#     --docker-password=<your-dockerhub-token> \
#   Then uncomment the imagePullSecrets block below and re-apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: farmconnect-sa
  namespace: farmconnect
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/farmconnect-workload-role
# imagePullSecrets:
#   - name: dockerhub-creds

# ---------------------------------------------------------------------------
# Secrets (placeholders - see header comment above, don't apply this as-is)
# ---------------------------------------------------------------------------
---
# PLACEHOLDER VALUES - replace before applying, and never commit the real values to git.
# stringData lets you write plaintext here (Kubernetes base64-encodes it on apply) so you
# don't have to hand-encode anything, but that also means this file itself is sensitive
# once filled in - keep it out of version control (see .gitignore note in README) or,
# better, generate it at deploy time instead:
#
#   kubectl create secret generic farmconnect-secrets -n farmconnect \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="<a-strong-password>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For a real production setup, use AWS Secrets Manager + the External Secrets Operator
# (or AWS Secrets and Configuration Provider for the Secrets Store CSI Driver) instead of
# a plain Kubernetes Secret - this file is the "get it running" version.
apiVersion: v1
kind: Secret
metadata:
  name: farmconnect-secrets
  namespace: farmconnect
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32_OUTPUT"
  MYSQL_ROOT_PASSWORD: "REPLACE_WITH_A_STRONG_PASSWORD"

# ---------------------------------------------------------------------------
# Shared ConfigMap
# ---------------------------------------------------------------------------
---
# Shared, non-secret config injected into every business/infra service via envFrom.
# Values here use Kubernetes Service names (see each svc.yml) - since every Service is
# named identically to its docker-compose counterpart, these match the defaults already
# baked into each service's application.properties (e.g. ${EUREKA_URI:http://discovery-service:8761/eureka/}).
# They're spelled out explicitly here anyway rather than relying on those defaults, since
# a manifest that states its own wiring is easier to reason about than one that doesn't.
apiVersion: v1
kind: ConfigMap
metadata:
  name: farmconnect-config
  namespace: farmconnect
data:
  EUREKA_URI: "http://discovery-service:8761/eureka/"
  CONFIG_SERVER_URI: "http://config-server:8888"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Replace with your actual ALB/NLB hostname (or domain, once you put one in front of it)
  # once you know it - `kubectl get svc frontend -n farmconnect` after the first deploy.
  CORS_ALLOWED_ORIGINS: "http://localhost"
  JPA_DDL_AUTO: "validate"

# ---------------------------------------------------------------------------
# discovery-service (Eureka)
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: farmconnect
  labels:
    app: discovery-service
spec:
  replicas: 1  # Eureka peers would need each other's address to cluster - single instance for now
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: discovery-service
          # Build & push from ./farmconnect-backend (Dockerfile: discovery-service/Dockerfile)
          # to your Docker Hub repo, then replace this placeholder.
          image: "<DOCKERHUB_USERNAME>/farmconnect-discovery-service:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

# ---------------------------------------------------------------------------
# discovery-service - Service
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: farmconnect
  labels:
    app: discovery-service
spec:
  type: ClusterIP
  selector:
    app: discovery-service
  ports:
    - name: http
      port: 8761
      targetPort: 8761

