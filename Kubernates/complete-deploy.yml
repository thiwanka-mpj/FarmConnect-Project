# ---------------------------------------------------------------------------
# redis
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: farmconnect
  labels:
    app: redis
spec:
  replicas: 1  # cache only (gateway rate-limit counters) - fine to lose on restart
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

# ---------------------------------------------------------------------------
# redis - Service
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: farmconnect
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

# ---------------------------------------------------------------------------
# kafka (StatefulSet, KRaft mode)
# ---------------------------------------------------------------------------
---
# StatefulSet (not a plain Deployment) because Kafka needs a stable identity + persistent
# disk across restarts - the file is still named deployment.yml to match every other
# service folder's naming convention.
#
# Prerequisite: your EKS cluster needs the EBS CSI driver installed (it's an EKS add-on -
# `aws eks describe-addon --cluster-name <cluster> --addon-name aws-ebs-csi-driver`, or
# add it via your Terraform if it's not there yet) so the volumeClaimTemplate below can
# actually provision a disk. Without it, the pod will sit in Pending forever.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: farmconnect
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: kafka
          image: "apache/kafka:3.7.0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

# ---------------------------------------------------------------------------
# kafka - Service
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: farmconnect
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

# ---------------------------------------------------------------------------
# user-db (StatefulSet)
# ---------------------------------------------------------------------------
---
# StatefulSet (not a plain Deployment) - a database needs a stable identity + persistent
# disk across restarts. File is still named deployment.yml to match the folder convention
# used across every service in this Kubernates/ directory.
#
# Prerequisite: EBS CSI driver installed on the cluster (see kafka/deployment.yml's note -
# same requirement applies here). Without it the volumeClaimTemplate PVC stays Pending.
#
# This reuses the exact same image built for docker-compose (database/user-db/Dockerfile) -
# the schema is already baked in, so there's no separate init step to manage here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
  namespace: farmconnect
  labels:
    app: user-db
spec:
  serviceName: user-db
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: user-db
          image: "<DOCKERHUB_USERNAME>/farmconnect-user-db:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: farmconnect-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "user_db"
          volumeMounts:
            - name: user-db-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: user-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

# ---------------------------------------------------------------------------
# user-db - Service
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: farmconnect
  labels:
    app: user-db
spec:
  type: ClusterIP
  selector:
    app: user-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

