# StatefulSet (not a plain Deployment) - a database needs a stable identity + persistent
# disk across restarts. File is still named deployment.yml to match the folder convention
# used across every service in this Kubernates/ directory.
#
# Prerequisite: EBS CSI driver installed on the cluster (see kafka/deployment.yml's note -
# same requirement applies here). Without it the volumeClaimTemplate PVC stays Pending.
#
# This reuses the exact same image built for docker-compose (database/product-db/Dockerfile) -
# the schema is already baked in, so there's no separate init step to manage here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-db
  namespace: farmconnect
  labels:
    app: product-db
spec:
  serviceName: product-db
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: product-db
          image: "thiwanka365/farmconnect-product-db:b00f36b93df3e24b84c93de1cd12d236615b4c9f"
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: farmconnect-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "product_db"
          volumeMounts:
            - name: product-db-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h localhost -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: product-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
