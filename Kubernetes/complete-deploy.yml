          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: farmconnect-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

# ---------------------------------------------------------------------------
# config-server - Service
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: farmconnect
  labels:
    app: config-server
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
