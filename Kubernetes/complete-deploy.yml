            limits:
              cpu: "200m"
              memory: "256Mi"

# ---------------------------------------------------------------------------
# frontend - Service (ClusterIP, fronted by the Ingress below)
# ---------------------------------------------------------------------------
---
# ClusterIP, not LoadBalancer - the Ingress (ingress.yml, in this same folder) is now the
# public entry point instead, provisioning an AWS ALB via the AWS Load Balancer Controller.
# Keeping this as type: LoadBalancer as well would create a second, redundant load balancer
# alongside the ALB - this Service exists purely so the Ingress has something to route to.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: farmconnect
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

# ---------------------------------------------------------------------------
# frontend - Ingress (provisions an AWS ALB - see this file's comments for prerequisites)
# ---------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: farmconnect
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

