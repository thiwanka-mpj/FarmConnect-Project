# ---------------------------------------------------------------------------
# admin-service (no database - REST aggregator)
# ---------------------------------------------------------------------------
---
# admin-service owns no database of its own (see database-per-service split) - it only
# needs Eureka/config-server/JWT wiring, no SPRING_DATASOURCE_* env vars at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: farmconnect
  labels:
    app: admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      serviceAccountName: farmconnect-sa
      containers:
        - name: admin-service
          image: "thiwanka365/farmconnect-admin-service:8b69484965b3f1f186be6141f2e77ab14f2a82ca"
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
